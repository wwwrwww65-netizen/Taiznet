<!-- 
  NOTE: This file is essential for the login process.
  It catches the user, shows them index.html, and provides variables.
  The user never sees this file directly.
-->
$(if chap-id)
	<form name="sendin" action="$(link-login-only)" method="post">
		<input type="hidden" name="username" />
		<input type="hidden" name="password" />
		<input type="hidden" name="dst" value="$(link-orig)" />
		<input type="hidden" name="popup" value="true" />
	</form>
	
	<script type="text/javascript" src="md5.js"></script>
	<script type="text/javascript">

	</script>
$(endif)

<script>
    var error = "$(error-orig)";
    if (error && error !== '' && !error.startsWith('$(')) {
        // If there is a real error message, redirect with it.
        window.location.href = "index.html?error=" + encodeURIComponent(error);
    } else {
        // Otherwise, redirect without an error.
        window.location.href = "index.html";
    }
</script>
